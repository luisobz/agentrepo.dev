name: Linux Agent

on:
  pull_request:
    paths: ['agents/linux-agent/**', '.github/workflows/linux-agent.yml']
  push:
    branches: [main]
    paths: ['agents/linux-agent/**', '.github/workflows/linux-agent.yml']
    tags: ['linux-agent-v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit, routing, authorization and publication checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: agents/linux-agent
        run: python3 -m unittest discover -s agents/linux-agent/tests
      - name: Isolated Debian permissions and sudo smoke test
        run: |
          docker run --rm --mount "type=bind,src=$PWD/agents/linux-agent,dst=/kit,readonly" debian:13-slim \
            bash -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 sudo systemd passwd >/dev/null && bash /kit/tests/container-smoke.sh'
      - name: Package allowlisted public sources
        run: python3 agents/linux-agent/tools/package.py "$RUNNER_TEMP/linux-agent"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-agent-package
          path: ${{ runner.temp }}/linux-agent/*

  release:
    if: startsWith(github.ref, 'refs/tags/linux-agent-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate independent agent version
        run: test "$GITHUB_REF_NAME" = "linux-agent-v$(cat agents/linux-agent/VERSION)"
      - uses: actions/download-artifact@v4
        with:
          name: linux-agent-package
          path: release
      - name: Publish candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --latest=false --prerelease \
            --title "Linux Agent ${GITHUB_REF_NAME#linux-agent-v} candidate" \
            --notes "Generic Telegram Linux administration kit. Review README.md and VALIDATION.md before installation. Isolated tests pass; real systemd/Telegram/provider validation on a disposable VM remains required. No credentials included."
