name: Deploy (tag)

# Despliega a Spaceship (cPanel/Passenger) al publicar un tag `vX.Y.Z`.
#   - web         → app Node.js (Next.js standalone) — pública en agentrepo.dev
#   - admin       → app Node.js (Next.js standalone) — panel de administración
#   - backend-web → app Node.js (NestJS + tRPC, BFF)
#   - backend-ai  → app Node.js (NestJS, workflows IA internos)
#   - migrate     → prisma migrate deploy contra la BD de producción
#
# También se puede lanzar a mano desde la pestaña Actions (workflow_dispatch)
# eligiendo qué desplegar.
#
# Los bundles se suben AUTOCONTENIDOS (incluyen node_modules y el cliente
# Prisma ya generado): en cPanel NO hay que pulsar "Run NPM Install".
#
# Configuración (Settings → Secrets and variables → Actions):
#   Secrets:  SSH_HOST, SSH_USER, SSH_KEY, SSH_KNOWN_HOSTS, DATABASE_URL (para migrate)
#   Variables: SSH_PORT (def. 22), NODE_VERSION (def. 24),
#              NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SUPABASE_URL,
#              NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
#              WEB_PATH, ADMIN_PATH, BACKEND_WEB_PATH, BACKEND_AI_PATH
#              (rutas relativas al home del usuario SSH; defaults abajo)
# Ver docs/DEPLOY.md para el detalle.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      only:
        description: '¿Qué desplegar?'
        type: choice
        default: all
        options: [all, web, admin, backend-web, backend-ai, migrate]

concurrency:
  group: agentrepo-database-operations
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: ${{ vars.NODE_VERSION || '24' }}
  SSH_PORT: ${{ vars.SSH_PORT || '22' }}
  # Dummy para el postinstall (prisma generate); nunca se conecta.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  # Variables públicas que Next.js inlinea en build:
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://agentrepo.dev/web/api/v1' }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

jobs:
  # ---------------------------------------------------------------- VERIFY
  # Puerta de calidad: lint + tests + build ANTES de tocar producción.
  # Un build que compile pero rompa tests no debe llegar a desplegarse.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint + tests
        run: pnpm verify

      - name: Build (todas las apps y paquetes)
        run: pnpm build

  # ---------------------------------------------------------------- REHEARSE
  rehearse-migrations:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # versión leída de packageManager en package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Supabase pooler CA
        run: |
          curl --fail --silent --show-error --location \
            https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt \
            --output /tmp/supabase-ca.crt

      - name: Clone production public schema to preproduction and test migrations
        env:
          PROD_MIGRATION_DATABASE_URL: ${{ secrets.PROD_MIGRATION_DATABASE_URL }}
          PRE_MIGRATION_DATABASE_URL: ${{ secrets.PRE_MIGRATION_DATABASE_URL }}
          PROD_PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
          PRE_PROJECT_REF: ${{ vars.PRE_PROJECT_REF }}
        run: |
          test -n "$PROD_MIGRATION_DATABASE_URL" && test -n "$PRE_MIGRATION_DATABASE_URL" || {
            echo "::error::Faltan las URL de migración de producción o preproducción"
            exit 1
          }
          bash scripts/db/stage-migrations.sh

  # ---------------------------------------------------------------- MIGRATE
  migrate:
    needs: rehearse-migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Supabase pooler CA
        run: |
          curl --fail --silent --show-error --location \
            https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt \
            --output /tmp/supabase-ca.crt

      - name: Prisma migrate deploy
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_MIGRATION_DATABASE_URL }}
          PROD_MIGRATION_DATABASE_URL: ${{ secrets.PROD_MIGRATION_DATABASE_URL }}
          PROD_PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::error::Falta PROD_MIGRATION_DATABASE_URL: no se puede desplegar sin aplicar las migraciones."
            exit 1
          fi
          python3 scripts/db/validate-targets.py
          DATABASE_URL="$PROD_DATABASE_URL" pnpm db:migrate:deploy

  # ---------------------------------------------------------------- WEB
  web:
    # !cancelled(): el job corre aunque migrate se haya saltado (dispatch selectivo)
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'web') }}
    needs: [verify, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — secrets configurados
        run: |
          test -n "${{ secrets.SSH_HOST }}" || { echo "::error::Falta el secret SSH_HOST"; exit 1; }

      - name: Guard — variables públicas de autenticación
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY" || { echo "::error::Faltan NEXT_PUBLIC_SUPABASE_URL o NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"; exit 1; }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx build web

      - name: Preparar bundle standalone
        run: bash scripts/package-next-standalone.sh web deploy-out/web

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS" || { echo "::error::Faltan SSH_KEY o SSH_KNOWN_HOSTS"; exit 1; }
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Subir web y reiniciar (rsync + Passenger)
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          DEST: ${{ vars.WEB_PATH || 'backend/agentrepo.dev/web' }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=yes"
          rsync -az --delete -e "$SSH" \
            --exclude '.env' \
            --exclude 'tmp/' \
            --exclude '*.log' \
            deploy-out/web/ "$USER@$HOST:$DEST/"
          # Passenger recarga la app al ver cambiar tmp/restart.txt
          $SSH "$USER@$HOST" "mkdir -p '$DEST/tmp' && touch '$DEST/tmp/restart.txt'"

  # ---------------------------------------------------------------- ADMIN
  admin:
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'admin') }}
    needs: [verify, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — secrets configurados
        run: |
          test -n "${{ secrets.SSH_HOST }}" || { echo "::error::Falta el secret SSH_HOST"; exit 1; }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx build admin

      - name: Preparar bundle standalone
        run: bash scripts/package-next-standalone.sh admin deploy-out/admin

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS" || { echo "::error::Faltan SSH_KEY o SSH_KNOWN_HOSTS"; exit 1; }
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Subir admin y reiniciar (rsync + Passenger)
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          DEST: ${{ vars.ADMIN_PATH || 'backend/agentrepo.dev/admin' }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=yes"
          rsync -az --delete -e "$SSH" \
            --exclude '.env' \
            --exclude 'tmp/' \
            --exclude '*.log' \
            deploy-out/admin/ "$USER@$HOST:$DEST/"
          $SSH "$USER@$HOST" "mkdir -p '$DEST/tmp' && touch '$DEST/tmp/restart.txt'"

  # ---------------------------------------------------------------- BACKEND WEB
  backend-web:
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'backend-web') }}
    needs: [verify, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — secrets configurados
        run: |
          test -n "${{ secrets.SSH_HOST }}" || { echo "::error::Falta el secret SSH_HOST"; exit 1; }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Empaquetar backend autocontenido (nx prune + deps de producción)
        run: |
          pnpm exec nx run backend-web:prune
          # El lockfile podado modela workspace_modules/* como importers:
          # el bundle necesita su propio pnpm-workspace.yaml para resolverlos.
          printf "packages:\n  - 'workspace_modules/@agentrepo/*'\n" > apps/backend-web/dist/pnpm-workspace.yaml
          pnpm --dir apps/backend-web/dist install --prod --frozen-lockfile
          # Genera el cliente Prisma DENTRO del bundle (compilador WASM, portable)
          pnpm --dir apps/backend-web/dist/workspace_modules/@agentrepo/database exec prisma generate --schema prisma/schema.prisma
          node scripts/fix-pruned-workspace-entries.mjs apps/backend-web/dist

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS" || { echo "::error::Faltan SSH_KEY o SSH_KNOWN_HOSTS"; exit 1; }
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Subir backend-web y reiniciar (rsync + Passenger)
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          DEST: ${{ vars.BACKEND_WEB_PATH || 'backend/agentrepo.dev/backend-web' }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=yes"
          rsync -az --delete -e "$SSH" \
            --exclude '.env' \
            --exclude 'tmp/' \
            --exclude '*.log' \
            apps/backend-web/dist/ "$USER@$HOST:$DEST/"
          $SSH "$USER@$HOST" "mkdir -p '$DEST/tmp' && touch '$DEST/tmp/restart.txt'"

  # ---------------------------------------------------------------- BACKEND AI
  backend-ai:
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'backend-ai') }}
    needs: [verify, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — secrets configurados
        run: |
          test -n "${{ secrets.SSH_HOST }}" || { echo "::error::Falta el secret SSH_HOST"; exit 1; }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Empaquetar backend autocontenido (nx prune + deps de producción)
        run: |
          pnpm exec nx run backend-ai:prune
          printf "packages:\n  - 'workspace_modules/@agentrepo/*'\n" > apps/backend-ai/dist/pnpm-workspace.yaml
          pnpm --dir apps/backend-ai/dist install --prod --frozen-lockfile
          pnpm --dir apps/backend-ai/dist/workspace_modules/@agentrepo/database exec prisma generate --schema prisma/schema.prisma
          node scripts/fix-pruned-workspace-entries.mjs apps/backend-ai/dist

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS" || { echo "::error::Faltan SSH_KEY o SSH_KNOWN_HOSTS"; exit 1; }
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Subir backend-ai y reiniciar (rsync + Passenger)
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          DEST: ${{ vars.BACKEND_AI_PATH || 'backend/agentrepo.dev/backend-ai' }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=yes"
          rsync -az --delete -e "$SSH" \
            --exclude '.env' \
            --exclude 'tmp/' \
            --exclude '*.log' \
            apps/backend-ai/dist/ "$USER@$HOST:$DEST/"
          $SSH "$USER@$HOST" "mkdir -p '$DEST/tmp' && touch '$DEST/tmp/restart.txt'"

  # A release represents a deployment that passed live checks, not just a build.
  smoke:
    needs: [verify, migrate, web, admin, backend-web, backend-ai]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed routes
        run: |
          for route in / /admin /web/api/v1/api/health /api/ai/api/health; do
            curl --fail --silent --show-error --location --retry 8 --retry-delay 5 \
              --retry-all-errors --max-time 20 --output /dev/null \
              "https://agentrepo.dev${route}"
          done
          curl --fail --silent --show-error --retry 8 --retry-delay 5 \
            --retry-all-errors --max-time 20 --output /dev/null \
            "https://admin.agentrepo.dev/login"

  release:
    needs: smoke
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --generate-notes
