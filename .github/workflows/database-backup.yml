name: Daily production database backup

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: agentrepo-database-operations
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Supabase pooler CA
        run: |
          curl --fail --silent --show-error --location \
            https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt \
            --output /tmp/supabase-ca.crt

      - name: Dump and encrypt production database
        env:
          PROD_MIGRATION_DATABASE_URL: ${{ secrets.PROD_MIGRATION_DATABASE_URL }}
          PROD_PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: bash scripts/db/backup-production.sh

      - name: Upload encrypted backup (seven-day expiry)
        uses: actions/upload-artifact@v4
        with:
          name: production-db-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/agentrepo-backup-${{ github.run_id }}/prod.dump.gpg
            ${{ runner.temp }}/agentrepo-backup-${{ github.run_id }}/prod.dump.gpg.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Delete backups beyond the latest seven
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("production-db-")) | [.created_at, .id] | @tsv' \
            | sort -r \
            | tail -n +8 \
            | cut -f2 \
            | while read -r artifact_id; do
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
              done
