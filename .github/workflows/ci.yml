name: CI

# Verifica lint + tests + builds en cada push a main y en cada pull request.
# No necesita secrets: usa una DATABASE_URL dummy sólo para que
# `prisma generate` (postinstall) pueda resolver la variable.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: ${{ vars.NODE_VERSION || '24' }}
  # Dummy: sólo se usa para generar el cliente Prisma, nunca se conecta.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  NEXT_PUBLIC_API_URL: http://localhost:4000
  NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: '11111111111111111111111111111111'

jobs:
  verify:
    # Match the Linux distribution supported by the pinned Playwright release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # versión leída de packageManager en package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Check deployment safety gates
        run: |
          python3 tests/deployment/check-gates.py
          python3 tests/deployment/check-launch-runtime.py
          python3 tests/deployment/check-db-credentials.py
          python3 tests/deployment/check-availability.py

      - run: pnpm install --frozen-lockfile

      - name: Check production dependency advisories
        run: |
          node tests/deployment/check-braces.mjs
          pnpm audit --prod --audit-level=high

      - name: Validate sprite atlas limits and assets
        run: python3 -m unittest discover -s tests/sprites -p 'test_*.py'

      - name: Lint + tests
        run: pnpm verify

      - name: Build (todas las apps y paquetes)
        run: pnpm build

      - name: Validate reproducible backend bundles
        run: bash scripts/check-backend-bundles.sh

      - name: Install browser for UI checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Desktop and mobile navigation
        run: pnpm test:e2e
